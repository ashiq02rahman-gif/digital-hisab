<!-- MODAL: ADD DUE -->
        <div id="modal-due" class="hidden absolute inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
            <div class="bg-white w-full rounded-2xl p-6 shadow-2xl space-y-4">
                <h3 class="text-lg font-bold text-gray-800">নতুন বাকি এন্ট্রি</h3>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">গ্রাহকের নাম</label>
                    <input type="text" id="due-name" autocomplete="off" placeholder="নাম লিখুন" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">মোবাইল নম্বর (১১ ডিজিট)</label>
                    <input type="tel" id="due-phone" maxlength="11" autocomplete="off" placeholder="017xxxxxxxx" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">টাকার পরিমাণ</label>
                    <input type="number" id="due-amount" autocomplete="off" placeholder="৫০০" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">তারিখ</label>
                    <input type="date" id="due-date" class="w-full px-4 py-2.5 border rounded-xl outline-none focus:ring-2">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="closeModals()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-bold">বাতিল</button>
                    <button onclick="saveDueTransaction()" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-bold">সংরক্ষণ</button>
                </div>
            </div>
        </div>
